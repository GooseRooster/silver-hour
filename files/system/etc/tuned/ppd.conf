# PPD -> TuneD profile mapping shared by both silver-hour flavours.
#
# tuned-ppd translates the power-profiles-daemon API (used by the GNOME power
# panel and the game-performance helper) onto TuneD. The gaming flavour
# overrides performance -> latency-performance by re-applying its own copy of
# this file.
[main]
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
performance=throughput-performance

[battery]
# On battery, balanced maps to TuneD's balanced-battery profile (Fedora default).
balanced=balanced-battery
