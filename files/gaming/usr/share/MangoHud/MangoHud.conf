# silver-hour default MangoHud configuration.
#
# This is the system-wide default; it is used whenever a user has no
# ~/.config/MangoHud/MangoHud.conf of their own. Toggle the overlay in-game
# with RightShift+F12, or launch with `mangohud %command%` /
# `MANGOHUD=1 %command%`.

# Core readouts.
fps
frame_timing
gpu_stats
gpu_temp
gpu_power
cpu_stats
cpu_temp
cpu_power
ram
vram
wine
version

# Layout: keep it readable and out of the way.
background_alpha=0.5
font_size=20
position=top-left
toggle_hud=Shift_R+F12

# Limit/toggle keys, matching common in-game muscle memory.
fps_limit=0
toggle_fps_limit=Shift_L+F1

# Colours: FPS shifts to yellow/red as it drops.
fps_color_change
