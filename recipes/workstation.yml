---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silver-hour-workstation
description: >-
  silver-hour workstation — atomic Fedora Silverblue with Ghostty, Bazaar and
  a Nix / Home Manager / Homebrew userland.
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: latest

modules:
  # Everything shared with the gaming flavour lives in common.yml, so gaming is
  # a strict superset of this image.
  - from-file: common.yml

  # Must stay last.
  - type: signing
