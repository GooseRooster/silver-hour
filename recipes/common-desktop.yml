---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# GNOME desktop layer. The base already provides the full GNOME session, so
# this layer only makes silver-hour's deliberate changes: Ghostty as the
# default terminal, Bazaar instead of GNOME Software, GPU Screen Recorder, and
# the shell extensions that ship enabled by default.
modules:
  # --- Package installs and removals -------------------------------------
  - type: dnf
    repos:
      cleanup: true
      copr:
        - scottames/ghostty
        - brycensranch/gpu-screen-recorder-git
    install:
      packages:
        # Terminal + screenshot/recording tooling.
        - ghostty
        - gpu-screen-recorder
        # Default GNOME Shell extensions (AppIndicator tray, Caffeine) + Bazaar
        # companion runtime + Nautilus extension runtime. Caffeine is distro
        # packaged; the Fedora build tracks the image's GNOME version.
        - gnome-shell-extension-appindicator
        - gnome-shell-extension-caffeine
        - nautilus-python
        # Default-terminal plumbing and the tray indicator runtime.
        - xdg-terminal-exec
        - libayatana-appindicator-gtk3
        - python3-gobject
        - desktop-file-utils
        - unzip
        - curl
    remove:
      packages:
        # Ghostty replaces the stock terminals; GNOME Software is replaced by
        # Bazaar.
        - ptyxis
        - gnome-software

  # --- Bazaar companion extension ----------------------------------------
  # Not on extensions.gnome.org; fetched from a pinned upstream revision and
  # installed system-wide.
  - type: script
    scripts:
      - install-bazaar-companion.sh

  # --- Re-apply image files after the RPM installs -----------------------
  # This runs after ghostty is installed so the "Terminal" desktop-entry
  # override wins over the package's own file, and after the removals so the
  # default-terminal and dconf defaults are the ones that ship.
  - type: files
    files:
      - source: system
        destination: /

  - type: systemd
    user:
      enabled:
        # Persistent "updates ready" tray indicator.
        - silver-hour-update-indicator.service

  # --- Fix executable bits and refresh caches ----------------------------
  - type: script
    snippets:
      # Ghostty ships its own Nautilus extension. Reuse it (it already handles
      # multi-folder and file selections) but relabel the entry and swap the
      # icon, so Nautilus shows a single "Open in Terminal" item. Fail the
      # build if Ghostty's source strings change rather than silently
      # regressing to "Open in Ghostty".
      - >-
        set -e;
        ext=/usr/share/nautilus-python/extensions/ghostty.py;
        test -f "$ext";
        grep -Fq "label=_('Open in Ghostty')" "$ext";
        grep -Fq "icon='com.mitchellh.ghostty'" "$ext";
        sed -i
        -e "s/label=_('Open in Ghostty')/label=_('Open in Terminal')/"
        -e "s/icon='com.mitchellh.ghostty'/icon='silver-hour-terminal'/" "$ext";
        grep -Fq "label=_('Open in Terminal')" "$ext";
        grep -Fq "icon='silver-hour-terminal'" "$ext";
        ! grep -Fq "Open in Ghostty" "$ext"
      - >-
        chmod 0755
        /usr/bin/termapp
        /usr/bin/gsr-shot
        /usr/bin/gsr-rec
      # Compile the system dconf database from /etc/dconf/db/local.d.
      - dconf update
      - >-
        update-desktop-database /usr/share/applications 2>/dev/null || true
      - >-
        gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true
