---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# Shared modules for every silver-hour flavour.
#
# Flavour recipes pull this in first (`- from-file: common.yml`) and must end
# with `- type: signing`. Everything shared lives here, so the gaming flavour
# (common.yml + gaming modules) is a strict superset of workstation.
modules:
  # --- System files -------------------------------------------------------
  # files/system/* is copied into the image root (/).
  - type: files
    files:
      - source: system
        destination: /

  # --- Base CLI/system packages ------------------------------------------
  # zsh is the login shell for every human user.
  - type: dnf
    install:
      packages:
        - git
        - ppp
        - playerctl
        - cava
        # shell + login-shell plumbing
        - zsh
        # file/text/search
        - bat
        - fd-find # binary: fd
        - ripgrep
        - eza
        - yq
        - less
        # disk usage
        - du-dust # Fedora binary name
        - ncdu
        # media / documents / images
        - mediainfo
        # terminal niceties
        - chafa
        - btop
        - trash-cli
        # general dev-ish utilities
        - gh
        - shellcheck
        - shfmt

  # --- Fonts -------------------------------------------------------------
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - JetBrainsMono
        - SourceCodePro
        - NerdFontsSymbolsOnly
        - Ubuntu
        - Iosevka

  # --- Baseline Flatpaks -------------------------------------------------
  # The GNOME base image is minimal: it ships the shell, core libs, Nautilus,
  # Firefox, Disks and System Monitor, but not the GNOME apps. They are
  # installed here as system Flatpaks from Flathub.
  #
  # Boxes is the exception: it is installed from the GNOME Nightly repo as the
  # rewritten beta (org.gnome.Boxes, from Flathub, is deliberately not
  # installed). The nightly remote is added system-wide so the app stays
  # updatable; note this is unstable upstream code and VM data loss is possible.
  #
  # notify: false everywhere: the module's setup scripts send a desktop
  # notification per configuration on *every* boot (the user script even
  # announces an empty list as "0 user Flatpak(s)"), so notifications are
  # disabled to keep boot quiet.
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - io.mpv.Mpv
          - io.github.kolunmi.Bazaar
          - be.alexandervanhee.gradia
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Weather
          - org.gnome.Maps
          - org.gnome.Papers
          - org.gnome.Loupe
          - org.gnome.Snapshot
          - org.gnome.SoundRecorder
          - org.gnome.TextEditor
          - org.gnome.FileRoller
          - org.gnome.baobab
          - org.gnome.font-viewer
          - org.gnome.Decibels
          - org.gnome.Logs
          - org.gnome.SimpleScan
          - org.gnome.Connections
          - org.gnome.Firmware
          - org.gnome.DejaDup
          - org.gnome.seahorse.Application
          - org.mozilla.thunderbird_esr
          - com.github.tchx84.Flatseal
          - com.mattjakeman.ExtensionManager
          - page.tesk.Refine
          - io.github.flattool.Warehouse
          - io.github.flattool.Ignition
          - it.mijorus.gearlever
          # Distrobox management and a developer toolbox.
          - com.ranfdev.DistroShelf
          - me.iepure.devtoolbox
      # GNOME Nightly: the rewritten Boxes beta (different app ID from the
      # stable org.gnome.Boxes, so the two can coexist; only the beta is
      # installed here).
      - notify: false
        scope: system
        repo:
          url: https://nightly.gnome.org/gnome-nightly.flatpakrepo
          name: gnome-nightly
          title: GNOME Nightly
        install:
          - org.gnome.Boxes.Devel
      # Add the per-user Flathub remote (no user packages). notify must be set
      # explicitly: it defaults to true and would otherwise pop "0 user
      # Flatpak(s)" on every login.
      - notify: false
        scope: user

  # --- Tuned system daemons ----------------------------------------------
  # ananicy-cpp: eBPF auto-nice daemon keeping the desktop responsive while
  # builds and containers run.
  - type: dnf
    repos:
      cleanup: true
      copr:
        - bieszczaders/kernel-cachyos-addons
    install:
      packages:
        - ananicy-cpp
        - cachyos-ananicy-rules

  - type: systemd
    system:
      enabled:
        - ananicy-cpp.service
        # Repairs users created on bash (installer) by setting /usr/bin/zsh
        # before the display manager, and keeps zsh listed in /etc/shells so
        # AccountsService/GDM treat it as a valid human login shell.
        - silver-hour-set-login-shell.service

  # --- Branding ----------------------------------------------------------
  # os-release is what `hostnamectl`, the GNOME About panel and other tools
  # read. Keep ID/VERSION_ID untouched so Fedora tooling (dnf, COPRs) keeps
  # working; only the human-facing fields are branded.
  - type: os-release
    properties:
      NAME: Fedora Atomic
      VARIANT: silver-hour
      VARIANT_ID: silver-hour
      DEFAULT_HOSTNAME: silver-hour
      HOME_URL: https://github.com/gooserooster/silver-hour
      DOCUMENTATION_URL: https://github.com/gooserooster/silver-hour
      SUPPORT_URL: https://github.com/gooserooster/silver-hour/issues
      BUG_REPORT_URL: https://github.com/gooserooster/silver-hour/issues

  # PRETTY_NAME/VERSION include the Fedora release number, which is only known
  # at build time, so derive them from the base's VERSION_ID. NAME/VERSION is
  # also what fetch tools (pfetch, neofetch, fastfetch) print and use to pick a
  # distro logo, so NAME contains "Fedora" on purpose.
  - type: script
    snippets:
      - >-
        target="$(readlink -f /etc/os-release)";
        ver="$(. "$target"; printf '%s' "${VERSION_ID}")";
        sed -i
        -e "s|^PRETTY_NAME=.*|PRETTY_NAME=\"Fedora Atomic ${ver} (silver-hour)\"|"
        -e "s|^VERSION=.*|VERSION=\"${ver} (silver-hour)\"|" "$target"

  # --- Flavour includes --------------------------------------------------
  - from-file: common-system.yml
  - from-file: common-devtools.yml
  - from-file: common-desktop.yml
  - from-file: common-updates.yml
  - from-file: common-userland.yml

  # --- Login shell sanity -------------------------------------------------
  # AccountsService treats an account whose login shell is not listed in
  # /etc/shells as a system account and GDM then refuses to show/start it,
  # which breaks first-time setup. Package transactions can rewrite /etc/shells
  # from the `setup` package default (sh/bash only), so re-assert zsh as the
  # last common step; gaming.yml repeats this after its own installs.
  - type: script
    snippets:
      - >-
        grep -qxF /usr/bin/zsh /etc/shells ||
        printf '%s\n' /usr/bin/zsh >> /etc/shells
