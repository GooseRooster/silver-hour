---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silver-hour-gaming
description: >-
  silver-hour gaming — the workstation flavour plus Steam, Wine/Faugus,
  MangoHud, Gamescope, ProtonPlus/Protontricks, a TuneD latency profile,
  ananicy-cpp and GPU Screen Recorder.
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: latest

modules:
  # The shared base (same as the workstation flavour).
  - from-file: common.yml

  # --- Wine stack + Faugus Launcher --------------------------------------
  # The Wine GUI entries (wine, winecfg, wineboot, notepad, winemine, the
  # "Wine" app-grid menu, ...) all live in Fedora's wine-desktop subpackage,
  # which the `wine` metapackage hard-requires. The metapackage is therefore
  # not installed: its components are listed individually and wine-desktop is
  # excluded, so `wine` and `winetricks` stay on PATH without flooding the
  # app grid. The optional plugins of the metapackage (cms, ldap, opencl,
  # smartcard, twain) are left out as well.
  - type: dnf
    repos:
      cleanup: true
      copr:
        - faugus/faugus-launcher
    install:
      exclude:
        - wine-desktop
      packages:
        - wine-core
        - wine-core.i686
        - wine-common
        - wine-pulseaudio
        - wine-pulseaudio.i686
        - wine-winefonts
        - wine-mono
        - wine-dxvk
        - mingw32-wine-gecko
        - mingw64-wine-gecko
        - mesa-dri-drivers.i686
        - gstreamer1-plugins-good
        - winetricks
        - faugus-launcher

  # --- General-purpose gaming utilities ----------------------------------
  # All from the Fedora repos (no extra remote). MangoHud covers native Steam
  # and Faugus; the i686 build covers 32-bit games. Gamescope provides the
  # micro-compositor (FSR, fps limiting, HDR); steam-devices ships the udev
  # rules for Steam/console controllers; vulkan-tools adds vulkaninfo.
  - type: dnf
    install:
      packages:
        - mangohud
        - mangohud.i686
        - gamescope
        - steam-devices
        - vulkan-tools

  # --- Gaming Flatpaks: ProtonPlus + Protontricks ------------------------
  # System Flatpaks, so they are (re)installed for every user after each boot
  # (see common.yml). ProtonPlus manages Proton/Wine/DXVK/VKD3D runners for
  # Steam and Faugus; Protontricks runs winetricks inside existing Proton
  # prefixes. notify is off to keep boot quiet (see common.yml).
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.vysp3r.ProtonPlus
          - com.github.Matoking.protontricks

  # --- Steam (negativo17) ------------------------------------------------
  # The base is built on negativo17 and leaves its enabling drop-in in place;
  # re-enable the repo, install Steam (i686 deps come from Fedora), and clean
  # the repo file up again.
  - type: dnf
    repos:
      cleanup: true
      nonfree: negativo17
    install:
      install-weak-deps: false
      packages:
        - steam

  # --- Gaming config + helpers -------------------------------------------
  # Applied *after* all package installs so the gaming PPD mapping wins over
  # the tuned-ppd RPM default and the source-built helpers land last.
  - type: files
    files:
      - source: gaming
        destination: /

  - type: script
    snippets:
      - "chmod 0755 /usr/bin/game-performance"
      # Refresh the desktop database: the winetricks.desktop override above
      # lands after the RPMs are installed, i.e. after common-desktop.yml
      # refreshed the cache.
      - "update-desktop-database /usr/share/applications 2>/dev/null || true"

  # Re-assert the zsh login shell after the Steam/Wine installs above (see
  # common.yml): keep the base's /etc/default/useradd (HOME=/var/home!) and only
  # force SHELL, and make sure zsh stays listed in /etc/shells.
  - type: script
    snippets:
      - >-
        sed -i 's|^SHELL=.*|SHELL=/usr/bin/zsh|' /etc/default/useradd 2>/dev/null || true;
        grep -q '^SHELL=' /etc/default/useradd || printf 'SHELL=/usr/bin/zsh\n' >> /etc/default/useradd;
        grep -qxF /usr/bin/zsh /etc/shells 2>/dev/null || printf '/usr/bin/zsh\n' >> /etc/shells

  # Must stay last.
  - type: signing
