---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: silver-hour-gaming
description: >-
  silver-hour gaming — the workstation flavour plus Steam, Wine/Faugus,
  MangoHud, Gamescope, ProtonPlus/Protontricks, a TuneD latency profile,
  ananicy-cpp and GPU Screen Recorder.
base-image: ghcr.io/blue-build/base-images/fedora-silverblue
image-version: latest

modules:
  # The shared base (same as the workstation flavour).
  - from-file: common.yml

  # --- Wine stack + Faugus Launcher --------------------------------------
  - type: dnf
    repos:
      cleanup: true
      copr:
        - faugus/faugus-launcher
    install:
      packages:
        - wine
        - winetricks
        - faugus-launcher

  # --- General-purpose gaming utilities ----------------------------------
  # All from the Fedora repos (no extra remote). MangoHud covers native Steam
  # and Faugus; the i686 build covers 32-bit games. Gamescope provides the
  # micro-compositor (FSR, fps limiting, HDR); steam-devices ships the udev
  # rules for Steam/console controllers; vulkan-tools adds vulkaninfo.
  - type: dnf
    install:
      packages:
        - mangohud
        - mangohud.i686
        - gamescope
        - steam-devices
        - vulkan-tools

  # --- Gaming Flatpaks: ProtonPlus + Protontricks ------------------------
  # System Flatpaks so they exist before first login. ProtonPlus manages
  # Proton/Wine/DXVK/VKD3D runners for Steam and Faugus; Protontricks runs
  # winetricks inside existing Proton prefixes. notify is off to keep boot
  # quiet (see common.yml).
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.vysp3r.ProtonPlus
          - com.github.Matoking.protontricks

  # --- Steam (negativo17) ------------------------------------------------
  # The base is built on negativo17 and leaves its enabling drop-in in place;
  # re-enable the repo, install Steam (i686 deps come from Fedora), and clean
  # the repo file up again.
  - type: dnf
    repos:
      cleanup: true
      nonfree: negativo17
    install:
      install-weak-deps: false
      packages:
        - steam

  # --- Gaming config + helpers -------------------------------------------
  # Applied *after* all package installs so the gaming PPD mapping wins over
  # the tuned-ppd RPM default and the source-built helpers land last.
  - type: files
    files:
      - source: gaming
        destination: /

  # Stage Adwaita-for-Steam sources; the per-user silver-hour-steam-theme
  # service applies them after Steam's first launch.
  - type: script
    scripts:
      - install-adwaita-for-steam.sh
    snippets:
      - "chmod 0755 /usr/bin/game-performance /usr/bin/silver-hour-steam-theme"

  - type: systemd
    user:
      enabled:
        # Applies the Steam skin once ~/.steam/steam appears (first launch).
        - silver-hour-steam-theme.path

  # Re-assert zsh in /etc/shells after the Steam/Wine installs above (see
  # common.yml): a login shell missing from /etc/shells makes AccountsService
  # classify the account as a system account and breaks GDM/first-time setup.
  - type: script
    snippets:
      - >-
        grep -qxF /usr/bin/zsh /etc/shells ||
        printf '%s\n' /usr/bin/zsh >> /etc/shells

  # Must stay last.
  - type: signing
